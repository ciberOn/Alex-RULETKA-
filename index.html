<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Roulette Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #ffae00;
            color: rgb(255, 255, 255);
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        
        .game-container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #be0000;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
        }
        
        h1 {
            color: #00ff22;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }
        
        .game-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 20px;
        }
        
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 0 auto;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><circle cx="200" cy="200" r="200" fill="%23008000"/><circle cx="200" cy="200" r="190" fill="%23ffffff"/><path d="M200,10 A190,190 0 0,1 390,200 A190,190 0 0,1 200,390 A190,190 0 0,1 10,200 A190,190 0 0,1 200,10 Z" fill="%23ff0000"/><path d="M200,10 A190,190 0 0,1 10,200 A190,190 0 0,1 200,390 A190,190 0 0,1 390,200 A190,190 0 0,1 200,10 Z" fill="%23000000"/><circle cx="200" cy="200" r="180" fill="%23ffffff"/><text x="200" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="%23ffffff">0</text><text x="380" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="%23ffffff">32</text><text x="200" y="370" font-family="Arial" font-size="14" text-anchor="middle" fill="%23ffffff">15</text><text x="20" y="200" font-family="Arial" font-size="14" text-anchor="middle" fill="%23ffffff">19</text></svg>');
            background-size: contain;
            border-radius: 50%;
            position: relative;
            transition: transform 5s cubic-bezier(0.17, 0.67, 0.21, 0.99);
            transform: rotate(0deg);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        
        .ball {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc);
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }
        
        .wheel-center {
            width: 40px;
            height: 40px;
            background-color: #f8d347;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .betting-area {
            flex: 1;
            min-width: 300px;
            background-color: #2d5a3d;
            padding: 20px;
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }
        
        .player-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background-color: #1a3b20;
            padding: 15px;
            border-radius: 8px;
        }
        
        .info-box {
            text-align: center;
        }
        
        .info-box h3 {
            margin: 0 0 5px 0;
            color: #f8d347;
        }
        
        .bet-controls {
            margin-bottom: 20px;
        }
        
        input {
            padding: 10px;
            width: 80px;
            margin-right: 10px;
            border-radius: 5px;
            border: none;
            text-align: center;
            font-weight: bold;
        }
        
        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
        }
        
        .spin-btn {
            background-color: #f8d347;
            color: #1a3b20;
            font-size: 18px;
            padding: 12px 25px;
        }
        
        .clear-btn {
            background-color: #ff6b6b;
            color: white;
        }
        
        .bet-btn {
            background-color: #4a7c59;
            color: white;
        }
        
        .bet-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .number-bets {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 5px;
            margin-bottom: 20px;
        }
        
        .number-btn {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border-radius: 50%;
        }
        
        .red {
            background-color: #ff3333;
        }
        
        .black {
            background-color: #333333;
        }
        
        .green {
            background-color: #008000;
        }
        
        .results {
            background-color: #1a3b20;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            min-height: 80px;
        }
        
        .history {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .history-number {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
        }
        
        @media (max-width: 768px) {
            .wheel-container {
                width: 300px;
                height: 300px;
            }
            
            .number-bets {
                grid-template-columns: repeat(6, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>РУЛЕТКА</h1>
        
        <div class="game-area">
            <div class="wheel-container">
                <div class="wheel" id="wheel"></div>
                <div class="ball" id="ball"></div>
                <div class="wheel-center"></div>
            </div>
            
            <div class="betting-area">
                <div class="player-info">
                    <div class="info-box">
                        <h3>БАЛАНС</h3>
                        <p id="balance">$1000</p>
                    </div>
                    <div class="info-box">
                        <h3>ТЕКУЩАЯ СТАВКА</h3>
                        <p id="current-bet">$0</p>
                    </div>
                    <div class="info-box">
                        <h3>ПОСЛЕДНЯЯ ПОБЕДА</h3>
                        <p id="last-win">$0</p>
                    </div>
                </div>
                
                <div class="bet-controls">
                    <input type="number" id="bet-amount" min="1" value="10">
                    <button class="spin-btn" id="spin-btn">КРУТИТЬ</button>
                    <button class="clear-btn" id="clear-btn">УБРАТЬ</button>
                </div>
                
                <div class="bet-options">
                    <button class="bet-btn red" data-bet="red">КРАСНЫЙ</button>
                    <button class="bet-btn black" data-bet="black">ЧЁРНЫЙ</button>
                    <button class="bet-btn green" data-bet="green">ЗЕЛЁНЫЙ (0)</button>
                    <button class="bet-btn" data-bet="even">ЧЁТНОЕ</button>
                    <button class="bet-btn" data-bet="odd">НЕЧЁТНОЕ</button>
                    <button class="bet-btn" data-bet="1-18">1-18</button>
                    <button class="bet-btn" data-bet="19-36">19-36</button>
                    <button class="bet-btn" data-bet="1st12">1-Я 12</button>
                    <button class="bet-btn" data-bet="2nd12">2-Й 12</button>
                    <button class="bet-btn" data-bet="3rd12">3-Й 12</button>
                </div>
                
                <div class="number-bets" id="number-bets">
                    <!-- Numbers will be generated by JavaScript -->
                </div>
                
                <div class="results">
                    <h3>РЕЗУЛЬТАТЫ</h3>
                    <p id="result-text">СДЕЛАТЬ СТАВКУ И КРУТИТЬ КОЛЕСО!</p>
                    <div class="history" id="history"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game configuration
        const config = {
            initialBalance: 1000,
            minBet: 1,
            maxBet: 1000,
            spinDuration: 5000, // 5 seconds
            ballSpeed: 0.3 // radians per millisecond
        };

        // Game state
        const state = {
            balance: config.initialBalance,
            currentBet: 0,
            bets: [],
            spinning: false,
            history: [],
            lastWin: 0,
            wheelPosition: 0,
            ballPosition: 0
        };

        // Roulette numbers with their properties
        const numbers = [
            { number: 0, color: 'green', angle: 0 },
            { number: 32, color: 'red', angle: 11.25 },
            { number: 15, color: 'black', angle: 22.5 },
            { number: 19, color: 'red', angle: 33.75 },
            { number: 4, color: 'black', angle: 45 },
            { number: 21, color: 'red', angle: 56.25 },
            { number: 2, color: 'black', angle: 67.5 },
            { number: 25, color: 'red', angle: 78.75 },
            { number: 17, color: 'black', angle: 90 },
            { number: 34, color: 'red', angle: 101.25 },
            { number: 6, color: 'black', angle: 112.5 },
            { number: 27, color: 'red', angle: 123.75 },
            { number: 13, color: 'black', angle: 135 },
            { number: 36, color: 'red', angle: 146.25 },
            { number: 11, color: 'black', angle: 157.5 },
            { number: 30, color: 'red', angle: 168.75 },
            { number: 8, color: 'black', angle: 180 },
            { number: 23, color: 'red', angle: 191.25 },
            { number: 10, color: 'black', angle: 202.5 },
            { number: 5, color: 'red', angle: 213.75 },
            { number: 24, color: 'black', angle: 225 },
            { number: 16, color: 'red', angle: 236.25 },
            { number: 33, color: 'black', angle: 247.5 },
            { number: 1, color: 'red', angle: 258.75 },
            { number: 20, color: 'black', angle: 270 },
            { number: 14, color: 'red', angle: 281.25 },
            { number: 31, color: 'black', angle: 292.5 },
            { number: 9, color: 'red', angle: 303.75 },
            { number: 22, color: 'black', angle: 315 },
            { number: 18, color: 'red', angle: 326.25 },
            { number: 29, color: 'black', angle: 337.5 },
            { number: 7, color: 'red', angle: 348.75 },
            { number: 28, color: 'black', angle: 360 }
        ];

        // DOM elements
        const wheel = document.getElementById('wheel');
        const ball = document.getElementById('ball');
        const balanceEl = document.getElementById('balance');
        const currentBetEl = document.getElementById('current-bet');
        const lastWinEl = document.getElementById('last-win');
        const betAmountEl = document.getElementById('bet-amount');
        const spinBtn = document.getElementById('spin-btn');
        const clearBtn = document.getElementById('clear-btn');
        const resultTextEl = document.getElementById('result-text');
        const historyEl = document.getElementById('history');
        const numberBetsEl = document.getElementById('number-bets');

        // Initialize the game
        function init() {
            // Create number buttons
            numbers.forEach(num => {
                if (num.number === 0) return; // Skip 0 (handled separately)
                
                const btn = document.createElement('button');
                btn.className = `number-btn ${num.color}`;
                btn.textContent = num.number;
                btn.dataset.bet = num.number;
                btn.addEventListener('click', placeBet);
                numberBetsEl.appendChild(btn);
            });
            
            // Event listeners
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.addEventListener('click', placeBet);
            });
            
            spinBtn.addEventListener('click', spinWheel);
            clearBtn.addEventListener('click', clearBets);
            
            // Update UI
            updateUI();
        }

        // Place a bet
        function placeBet(e) {
            if (state.spinning) return;
            
            const betType = e.target.dataset.bet;
            const betAmount = parseInt(betAmountEl.value);
            
            if (isNaN(betAmount) {
                alert('Please enter a valid bet amount');
                return;
            }
            
            if (betAmount < config.minBet) {
                alert(`Minimum bet is $${config.minBet}`);
                return;
            }
            
            if (betAmount > config.maxBet) {
                alert(`Maximum bet is $${config.maxBet}`);
                return;
            }
            
            if (state.balance < betAmount) {
                alert('Not enough balance');
                return;
            }
            
            // Add bet
            state.bets.push({
                type: betType,
                amount: betAmount
            });
            
            // Update state
            state.currentBet += betAmount;
            state.balance -= betAmount;
            
            // Update UI
            updateUI();
            
            // Visual feedback
            e.target.classList.add('active');
            setTimeout(() => e.target.classList.remove('active'), 200);
        }

        // Clear all bets
        function clearBets() {
            if (state.spinning) return;
            
            // Return all bet amounts to balance
            state.balance += state.currentBet;
            state.bets = [];
            state.currentBet = 0;
            
            updateUI();
        }

        // Spin the wheel
        function spinWheel() {
            if (state.spinning) return;
            
            if (state.bets.length === 0) {
                alert('Please place at least one bet before spinning');
                return;
            }
            
            state.spinning = true;
            spinBtn.disabled = true;
            
            // Determine the result (random number)
            const resultIndex = Math.floor(Math.random() * numbers.length);
            const result = numbers[resultIndex];
            
            // Calculate wheel rotation (at least 3 full rotations + offset to land on result)
            const fullRotations = 3;
            const targetAngle = fullRotations * 360 + (360 - result.angle);
            const spinTime = config.spinDuration;
            
            // Animate wheel and ball
            animateWheel(targetAngle, spinTime);
            
            // Calculate result after animation completes
            setTimeout(() => {
                calculateResult(result);
            }, spinTime);
        }

        // Animate wheel spinning
        function animateWheel(targetAngle, duration) {
            const startTime = performance.now();
            const startAngle = state.wheelPosition % 360;
            
            function updateAnimation(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Easing function for smooth deceleration
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                // Update wheel position
                state.wheelPosition = startAngle + (targetAngle * easeOut);
                wheel.style.transform = `rotate(${state.wheelPosition}deg)`;
                
                // Update ball position (rotates faster than wheel)
                state.ballPosition = (state.wheelPosition * 1.5) % 360;
                ball.style.transform = `translateX(-50%) rotate(${state.ballPosition}deg)`;
                
                if (progress < 1) {
                    requestAnimationFrame(updateAnimation);
                }
            }
            
            requestAnimationFrame(updateAnimation);
        }

        // Calculate win/loss
        function calculateResult(result) {
            let totalWin = 0;
            
            state.bets.forEach(bet => {
                let win = 0;
                const amount = bet.amount;
                
                switch(bet.type) {
                    case 'red':
                        if (result.color === 'red') win = amount * 2;
                        break;
                    case 'black':
                        if (result.color === 'black') win = amount * 2;
                        break;
                    case 'green':
                        if (result.number === 0) win = amount * 36;
                        break;
                    case 'even':
                        if (result.number !== 0 && result.number % 2 === 0) win = amount * 2;
                        break;
                    case 'odd':
                        if (result.number % 2 === 1) win = amount * 2;
                        break;
                    case '1-18':
                        if (result.number >= 1 && result.number <= 18) win = amount * 2;
                        break;
                    case '19-36':
                        if (result.number >= 19 && result.number <= 36) win = amount * 2;
                        break;
                    case '1st12':
                        if (result.number >= 1 && result.number <= 12) win = amount * 3;
                        break;
                    case '2nd12':
                        if (result.number >= 13 && result.number <= 24) win = amount * 3;
                        break;
                    case '3rd12':
                        if (result.number >= 25 && result.number <= 36) win = amount * 3;
                        break;
                    default:
                        // Number bet
                        if (parseInt(bet.type) === result.number) win = amount * 36;
                        break;
                }
                
                totalWin += win;
            });
            
            // Update game state
            state.balance += totalWin;
            state.lastWin = totalWin;
            state.bets = [];
            state.currentBet = 0;
            state.spinning = false;
            spinBtn.disabled = false;
            
            // Add to history
            state.history.unshift(result);
            if (state.history.length > 10) state.history.pop();
            
            // Update UI
            updateUI();
            
            // Show result message
            const colorName = result.color === 'red' ? 'Red' : (result.color === 'black' ? 'Black' : 'Green');
            resultTextEl.textContent = `The ball landed on ${colorName} ${result.number}.`;
            
            if (totalWin > 0) {
                resultTextEl.innerHTML += `<br>You won $${totalWin}!`;
            } else {
                resultTextEl.innerHTML += `<br>Better luck next time!`;
            }
            
            // Update history display
            updateHistory();
        }

        // Update history display
        function updateHistory() {
            historyEl.innerHTML = '';
            state.history.forEach(item => {
                const el = document.createElement('div');
                el.className = `history-number ${item.color}`;
                el.textContent = item.number;
                historyEl.appendChild(el);
            });
        }

        // Update UI elements
        function updateUI() {
            balanceEl.textContent = `$${state.balance}`;
            currentBetEl.textContent = `$${state.currentBet}`;
            lastWinEl.textContent = `$${state.lastWin}`;
        }

        // Initialize the game when loaded
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
